<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SoloFit · Вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --night-0: #05070F;
    --night-1: #0B1126;
    --night-2: #131C3B;
    --moon: #F2F6FF;
    --moon-2: #A9C4FF;
    --moon-3: #8FAAEA;
    --text: #E8EEF9;
    --muted: #8F9CBF;
    --line: rgba(255, 255, 255, 0.14);
    --danger: #FF8A9B;
    --display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    background:
      radial-gradient(900px 600px at 85% -10%, rgba(169, 196, 255, 0.22), transparent 60%),
      radial-gradient(700px 500px at -10% 30%, rgba(143, 170, 234, 0.12), transparent 60%),
      linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 55%, var(--night-0) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--moon-2); outline-offset: 3px; border-radius: 12px; }

  .glass {
    position: relative;
    background: linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0.03) 100%);
    -webkit-backdrop-filter: blur(22px) saturate(170%);
    backdrop-filter: blur(22px) saturate(170%);
    border: 1px solid var(--line);
    border-radius: 26px;
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.28),
      inset 0 -1px 0 rgba(255, 255, 255, 0.05);
    overflow: hidden;
  }
  .glass::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(120% 60% at 20% 0%, rgba(255,255,255,0.18), transparent 55%);
    pointer-events: none;
  }
  .glass > * { position: relative; }

  .wrap { max-width: 420px; margin: 0 auto; min-height: 100vh; padding: 40px 18px; padding-top: max(40px, env(safe-area-inset-top)); display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .brand { font-family: var(--display); font-weight: 700; font-size: 26px; color: var(--moon); text-align: center; }
  .sub { color: var(--muted); text-align: center; margin: -10px 0 0; font-size: 14px; }
  .card { padding: 22px; display: flex; flex-direction: column; gap: 14px; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; border-radius: 99px; background: rgba(5,7,15,0.35); border: 1px solid var(--line); }
  .seg button { padding: 10px; border: 0; border-radius: 99px; background: transparent; color: var(--muted); font-weight: 700; font-size: 14px; }
  .seg button[aria-selected="true"] {
    background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08));
    color: var(--moon); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 6px 18px rgba(0,0,0,0.35);
  }

  form { display: flex; flex-direction: column; gap: 12px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  input.field {
    width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line);
    background: rgba(5,7,15,0.45); color: var(--text); outline: none; font-size: 16px;
  }
  input.field:focus { border-color: var(--moon-2); }
  input.field[aria-invalid="true"] { border-color: var(--danger); }

  .btn {
    margin-top: 4px; width: 100%; padding: 13px; border-radius: 16px; border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(169,196,255,0.28), rgba(169,196,255,0.1));
    color: var(--moon); font-weight: 700; font-size: 15px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn.ghost { background: rgba(255,255,255,0.05); color: var(--muted); }

  .msg { font-size: 14px; border-radius: 14px; padding: 11px 13px; display: none; }
  .msg.show { display: block; }
  .msg.err { color: var(--danger); background: rgba(255,138,155,0.08); border: 1px solid rgba(255,138,155,0.25); }
  .msg.ok { color: var(--moon-2); background: rgba(169,196,255,0.08); border: 1px solid rgba(169,196,255,0.25); }

  .hidden { display: none !important; }
  .hello { font-family: var(--display); font-size: 20px; color: var(--moon); text-align: center; }
  .link { background: none; border: 0; color: var(--moon-2); font-weight: 700; padding: 0; text-decoration: underline; }
  .row { display: flex; flex-direction: column; gap: 10px; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main class="wrap">
  <div>
    <div class="brand">SoloFit</div>
    <p class="sub">Питание и тренировки под вашу цель</p>
  </div>

  <!-- Экран входа и регистрации -->
  <section id="authView" class="glass card" aria-live="polite">
    <div class="seg" role="tablist" aria-label="Выбор действия">
      <button type="button" role="tab" id="tabLogin" aria-selected="true" aria-controls="formLogin">Вход</button>
      <button type="button" role="tab" id="tabSignup" aria-selected="false" aria-controls="formSignup">Регистрация</button>
    </div>

    <form id="formLogin" novalidate>
      <label>Email
        <input class="field" id="loginEmail" type="email" autocomplete="email" required>
      </label>
      <label>Пароль
        <input class="field" id="loginPassword" type="password" autocomplete="current-password" required>
      </label>
      <div class="msg" id="loginMsg" role="alert"></div>
      <button class="btn" id="loginBtn" type="submit">Войти</button>
    </form>

    <form id="formSignup" class="hidden" novalidate>
      <label>Имя
        <input class="field" id="signupName" type="text" autocomplete="given-name" maxlength="40" required>
      </label>
      <label>Email
        <input class="field" id="signupEmail" type="email" autocomplete="email" required>
      </label>
      <label>Пароль (минимум 6 символов)
        <input class="field" id="signupPassword" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <div class="msg" id="signupMsg" role="alert"></div>
      <button class="btn" id="signupBtn" type="submit">Создать аккаунт</button>
    </form>
  </section>

  <!-- Выбор цели (после регистрации или первого входа) -->
  <section id="goalView" class="glass card hidden" aria-live="polite">
    <div class="hello">Какая у вас цель?</div>
    <p class="sub" style="margin:0">От неё будут зависеть калории и тренировки. Цель можно поменять позже.</p>
    <div class="row">
      <button class="btn goal" type="button" data-goal="weight_loss">Похудение</button>
      <button class="btn goal" type="button" data-goal="fat_loss">Сброс жира</button>
      <button class="btn goal" type="button" data-goal="muscle_gain">Набор мышечной массы</button>
      <button class="btn goal" type="button" data-goal="strength">Набор силовых</button>
    </div>
    <div class="msg" id="goalMsg" role="alert"></div>
  </section>

  <!-- Экран после входа -->
  <section id="homeView" class="glass card hidden" aria-live="polite">
    <div class="hello" id="hello">Привет!</div>
    <p class="sub" style="margin:0" id="goalLabel"></p>
    <div class="row">
      <a class="btn" id="openApp" href="https://claude.ai/artifact/RJgw4e94wVw29tqz9vcmWw" target="_blank" rel="noopener">Открыть приложение</a>
      <button class="btn ghost" id="logoutBtn" type="button">Выйти</button>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://jzfnjsbenwjrrrxzwnfe.supabase.co";
  var SUPABASE_KEY = "sb_publishable_ipXQ1eiB4fm024bDAdRr-Q_k6s-XlZY";

  var $ = function (id) { return document.getElementById(id); };
  var sb = null;
  if (window.supabase && window.supabase.createClient) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } else {
    document.addEventListener("DOMContentLoaded", function () {
      $("signupMsg").textContent = "Не загрузилась библиотека Supabase. Проверьте интернет или откройте страницу на хостинге и обновите её.";
      $("signupMsg").className = "msg show err";
      $("loginMsg").textContent = "Не загрузилась библиотека Supabase. Проверьте интернет или откройте страницу на хостинге и обновите её.";
      $("loginMsg").className = "msg show err";
    });
  }

  // ---------- Views ----------
  var GOAL_LABELS = {
    weight_loss: "Похудение",
    fat_loss: "Сброс жира",
    muscle_gain: "Набор мышечной массы",
    strength: "Набор силовых"
  };

  function showOnly(viewId) {
    ["authView", "goalView", "homeView"].forEach(function (id) {
      $(id).classList.toggle("hidden", id !== viewId);
    });
  }
  function showAuth() { showOnly("authView"); }

  function showHome(user) {
    if (!user) return showAuth();
    var meta = user.user_metadata || {};
    if (!meta.goal || !GOAL_LABELS[meta.goal]) return showGoal();
    var name = meta.name || user.email || "";
    $("hello").textContent = name ? "Привет, " + name + "!" : "Привет!";
    $("goalLabel").textContent = "Цель: " + GOAL_LABELS[meta.goal];
    showOnly("homeView");
  }

  function showGoal() { showOnly("goalView"); }

  // ---------- Tabs ----------
  function selectTab(which) {
    var login = which === "login";
    $("tabLogin").setAttribute("aria-selected", login ? "true" : "false");
    $("tabSignup").setAttribute("aria-selected", login ? "false" : "true");
    $("formLogin").classList.toggle("hidden", !login);
    $("formSignup").classList.toggle("hidden", login);
    clearMsg("loginMsg"); clearMsg("signupMsg");
  }
  $("tabLogin").addEventListener("click", function () { selectTab("login"); });
  $("tabSignup").addEventListener("click", function () { selectTab("signup"); });

  // ---------- Messages ----------
  function setMsg(id, text, kind) {
    var el = $(id);
    el.textContent = text;
    el.className = "msg show " + kind;
  }
  function clearMsg(id) {
    var el = $(id);
    el.textContent = "";
    el.className = "msg";
  }

  // Переводим частые ошибки Supabase на понятный язык
  function humanError(err) {
    var m = (err && err.message || "").toLowerCase();
    if (m.indexOf("invalid login") !== -1) return "Неверная почта или пароль.";
    if (m.indexOf("email not confirmed") !== -1) return "Подтвердите почту: мы отправили письмо со ссылкой.";
    if (m.indexOf("already registered") !== -1 || m.indexOf("already been registered") !== -1) return "Этот email уже зарегистрирован. Попробуйте войти.";
    if (m.indexOf("password") !== -1 && m.indexOf("6") !== -1) return "Пароль должен быть не короче 6 символов.";
    if (m.indexOf("rate limit") !== -1 || m.indexOf("too many") !== -1) return "Слишком много попыток. Подождите немного и попробуйте снова.";
    if (m.indexOf("network") !== -1 || m.indexOf("failed to fetch") !== -1) return "Нет связи с сервером. Проверьте интернет.";
    return "Что-то пошло не так. Попробуйте ещё раз.";
  }

  function validEmail(s) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s); }

  function setBusy(btnId, busy, idleText) {
    var b = $(btnId);
    b.disabled = busy;
    b.textContent = busy ? "Подождите..." : idleText;
  }

  // ---------- Login ----------
  $("formLogin").addEventListener("submit", async function (e) {
    e.preventDefault();
    clearMsg("loginMsg");
    var email = $("loginEmail").value.trim();
    var password = $("loginPassword").value;
    if (!validEmail(email)) return setMsg("loginMsg", "Введите корректный email.", "err");
    if (!password) return setMsg("loginMsg", "Введите пароль.", "err");

    setBusy("loginBtn", true, "Войти");
    var res = await sb.auth.signInWithPassword({ email: email, password: password });
    setBusy("loginBtn", false, "Войти");

    if (res.error) return setMsg("loginMsg", humanError(res.error), "err");
    showHome(res.data.user);
  });

  // ---------- Sign up ----------
  $("formSignup").addEventListener("submit", async function (e) {
    e.preventDefault();
    clearMsg("signupMsg");
    if (!sb) return setMsg("signupMsg", "Библиотека Supabase не загрузилась. Обновите страницу.", "err");
    var name = $("signupName").value.trim();
    var email = $("signupEmail").value.trim();
    var password = $("signupPassword").value;
    if (!name) return setMsg("signupMsg", "Введите имя.", "err");
    if (!validEmail(email)) return setMsg("signupMsg", "Введите корректный email.", "err");
    if (password.length < 6) return setMsg("signupMsg", "Пароль должен быть не короче 6 символов.", "err");

    setBusy("signupBtn", true, "Создать аккаунт");
    var res;
    try {
      res = await sb.auth.signUp({
        email: email,
        password: password,
        options: { data: { name: name } }
      });
    } catch (err) {
      console.error(err);
      setBusy("signupBtn", false, "Создать аккаунт");
      return setMsg("signupMsg", "Не удалось связаться с сервером: " + (err && err.message ? err.message : "неизвестная ошибка") + ".", "err");
    }
    setBusy("signupBtn", false, "Создать аккаунт");

    if (res.error) {
      console.error(res.error);
      return setMsg("signupMsg", humanError(res.error) + " (" + res.error.message + ")", "err");
    }

    // Если подтверждение почты выключено, сессия уже есть
    if (res.data.session) return showHome(res.data.user);

    // Иначе просим подтвердить почту
    setMsg("signupMsg", "Аккаунт создан. Мы отправили письмо на " + email + ". Подтвердите почту и войдите.", "ok");
    $("formSignup").reset();
  });

  // ---------- Goal selection ----------
  document.querySelectorAll(".goal").forEach(function (btn) {
    btn.addEventListener("click", async function () {
      clearMsg("goalMsg");
      if (!sb) return setMsg("goalMsg", "Библиотека Supabase не загрузилась. Обновите страницу.", "err");
      var goal = btn.getAttribute("data-goal");
      document.querySelectorAll(".goal").forEach(function (b) { b.disabled = true; });
      var res;
      try {
        res = await sb.auth.updateUser({ data: { goal: goal } });
      } catch (err) {
        res = { error: err };
      }
      document.querySelectorAll(".goal").forEach(function (b) { b.disabled = false; });
      if (res.error) return setMsg("goalMsg", "Не удалось сохранить цель: " + res.error.message, "err");
      showHome(res.data.user);
    });
  });

  // ---------- Logout ----------
  $("logoutBtn").addEventListener("click", async function () {
    await sb.auth.signOut();
    showAuth();
    selectTab("login");
  });

  // ---------- Keep the session between visits ----------
  sb.auth.onAuthStateChange(function (event, session) {
    if (session && session.user) showHome(session.user);
    else if (event === "SIGNED_OUT") showAuth();
  });

  sb.auth.getSession().then(function (r) {
    if (r.data && r.data.session) showHome(r.data.session.user);
  });
})();
</script>
</body>
</html>
